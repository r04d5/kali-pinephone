# Arquivo de configuração modelo para adicionar suporte a novos dispositivos
# Este arquivo deve ser preenchido com os parâmetros apropriados para o seu dispositivo
# É usado tanto para identificar o nome do arquivo de device-tree quanto para construir a
# imagem de boot.

# O chipset de referência usado como a primeira parte do nome do arquivo device-tree
# (por exemplo, "sdm845")
# Referência do chipset utilizada como primeira parte do nome do arquivo device-tree
chipset = ""

# Parâmetros da imagem de boot: endereços de carregamento e tamanho do setor do dispositivo de bloco
# Esses parâmetros podem ser extraídos de uma imagem de boot existente executando
# `abootimg -i <imagem>`, por exemplo
# Configuração da imagem de boot: endereços de carregamento e tamanho de página
[bootimg]
base = 0x0                # Endereço base para carregamento na memória
kernel = 0x0              # Offset do kernel em relação ao endereço base
ramdisk = 0x0             # Offset do ramdisk (initrd) em relação ao endereço base
second = 0x0              # Offset da segunda etapa do bootloader
tags = 0x0                # Offset para os tags do kernel
pagesize = 0              # Tamanho da página de memória em bytes
# OPCIONAL: descomente se o dispositivo precisar usar o formato bootimg v2, que
# incorpora uma cópia separada do DTB (não dependendo daquele anexado à imagem
# do kernel)
# OPCIONAL: descomente para dispositivos que precisam do formato de imagem de boot v2
# version = 2             # Versão do formato da imagem de boot
# dtb = 0x0               # Offset da Device Tree Blob

# Parâmetros específicos do dispositivo: são usados principalmente para identificar o dispositivo e
# especialmente o arquivo device-tree a ser usado, que é construído desta forma:
#   qcom/<chipset>-<vendor>-<model>[-<variant>].dtb
#
# Também é possível definir parâmetros adicionais de linha de comando usando a entrada "append",
# caso sejam necessárias peculiaridades em nível de kernel que tenham opções de linha de comando
# correspondentes
# Configuração específica para cada modelo de dispositivo
[[device]]
vendor = ""               # Fabricante do dispositivo (ex: "xiaomi", "oneplus")
model = ""                # Modelo/codinome do dispositivo (ex: "beryllium", "enchilada")
# OPCIONAL: descomente se este dispositivo usar um SoC diferente do mencionado
# na variável `chipset` de nível superior (ou se esta variável de nível superior estiver ausente)
# OPCIONAL: descomente se o dispositivo usar um chipset diferente do especificado acima
# chipset = ""            # Chipset específico para este dispositivo
# OPCIONAL: descomente se houver várias variantes do mesmo modelo que precisem
# de arquivos device-tree diferentes (por exemplo, "xiaomi-beryllium" tem variantes "ebbg" e
# "tianma")
# OPCIONAL: descomente se houver variantes do mesmo modelo que precisem de DTBs diferentes
# variant = ""            # Variante específica do dispositivo (ex: "ebbg", "tianma")
# OPCIONAL: descomente se forem necessários parâmetros adicionais de linha de comando
# OPCIONAL: descomente para adicionar parâmetros extras à linha de comando do kernel
# append = ""             # Parâmetros adicionais para a linha de comando do kernel
# OPCIONAL: descomente se o dispositivo usar parâmetros bootimg diferentes
# OPCIONAL: descomente se o dispositivo precisar de configurações de bootimg personalizadas
# bootimg = {version = 2, base = 0x0, kernel = 0x0, ramdisk = 0x0, dtb = 0x0, second = 0x0, tags = 0x0, pagesize = 4096 }
